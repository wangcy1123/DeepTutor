short_description: "在用户挂载的某个知识库中检索相关内容。"
when_to_use: "当答案大概率来自用户挂载的知识库（定义、公式、概念解释、教材内容）时使用；用户要求「把相关讲义页/图调出来」时也先用它做主题检索。"
input_format: "主题检索：{\"query\": \"非空自然语言查询\", \"kb_name\": \"挂载的某个知识库名称\"}，其余参数全部留空。精确取页/取图：在上述基础上再加 \"source_path\" 和 \"page\"（或 \"figure\"）。"
guideline: "课程材料优先检索知识库；概念检索必要时也用来源语言查询。**两种模式必须分清。** 主题检索只传 query 和 kb_name，source_path / asset_id / figure / page / region / source_hash 六个字段必须全部留空；返回的每条片段都以 [文件名 · PDF page N] 开头，相关图还会附上可直接嵌入的图片链接。只有已经知道确切页或图号时才做精确取页：页码要么来自上一步结果里的 PDF page N，要么来自用户明说，绝不猜、绝不用 1 占位——填了这些字段工具就从「搜索」切成「按页取图」，猜错的页会返回一张看起来正常但完全无关的页面。精确图号用 figure 加 kb_files 里的 source_path；矢量图、稀疏图注、表格或模糊标签用 source_path/page，必要时加归一化区域 region=[x0,y0,x1,y1]。追问沿用引用的 asset_id 或 source_hash，并重新读取实际像素后再作详细视觉判断。比较两份材料时分别调用，保持图片预算有界。"
note: "query 不能为空。讲解中需要展示教材原图时，把工具结果给出的 Markdown 图片链接原样嵌入回答，不要自己拼 URL，也不要只描述图片。保持图表编号和来源边界准确；歧义、缺失像素、不支持的页面或冲突证据应要求选择来源、检查页面或明确保留判断，不能替换成相似图。区分可见观察、仅基于图注的解释和一般背景知识；来源特定结论必须展示可核对的原图与位置。"
phase: "exploration"

short_description: "Retrieve relevant passages from one of the attached knowledge bases."
when_to_use: "Use when the answer is likely covered by the attached knowledge bases — definitions, formulas, concepts, or textbook explanations. Also the first step when the user asks to show the relevant textbook page or figure."
input_format: "Topic search: {\"query\": \"non-empty natural-language query\", \"kb_name\": \"one of the attached knowledge base names\"} and leave every other field empty. Exact page/figure: add \"source_path\" plus \"page\" (or \"figure\")."
guideline: "Prefer RAG before external search for course material. For concept discovery, query in the source language too when needed. **Two modes, choose deliberately.** Topic search passes only query and kb_name — source_path, asset_id, figure, page, region and source_hash must all be empty. Each returned passage begins with a [file name · PDF page N] header, and matching figures come with ready-to-embed image links. Exact page inspection is only for a page or figure you already know: the number either comes from a previous result's PDF page N header or was stated by the user. Never guess a page and never use 1 as a placeholder — supplying these fields switches the tool from search to page rendering, so a wrong page returns a confident, unrelated page. For an exact figure use figure plus source_path from kb_files; for a vector diagram, sparse caption, table or unreadable labels use source_path/page and optionally region=[x0,y0,x1,y1] normalized to 0..1. Reuse asset_id or source_hash from a citation for follow-ups; retrieve actual pixels again before detailed visual claims. Compare two sources with separate bounded calls."
note: "The query must be non-empty. When the explanation needs the textbook figure, embed the Markdown image link returned by the tool verbatim — do not invent a URL and do not merely describe the figure. Keep figure/table numbers and source boundaries exact. Ambiguity, missing pixels, unsupported pages or conflicting evidence require source selection, page inspection or abstention; never substitute a related figure. Distinguish visible observations, caption-only interpretation and general background. A citation and original image must support each source-specific claim."
phase: "exploration"
